<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VRAM RipperDoc</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23fcee0a'/%3E%3Cpath d='M6 8h5.4L16 20.2 20.6 8H26l-7.4 17h-5.2z' fill='%230b0d12'/%3E%3C/svg%3E">
<style>
:root{--bg:#0b0d12;--panel:#141821;--line:#262c3a;--fg:#e6e8ee;--dim:#8b93a7;--acc:#fcee0a;--accfg:#000;--hot:#ff4d6d;--ok:#3ddc97;--cy:#2de2e6;--okbg:#10281f;--badbg:#2e1219;--warnbg:#2b2810}
@media (prefers-color-scheme: light){:root:not([data-theme=dark]){--bg:#f6f7f9;--panel:#fff;--line:#dde1e8;--fg:#14161c;--dim:#5b6375;--acc:#8a7d00;--accfg:#fff;--hot:#c8102e;--ok:#0a8a5a;--cy:#007c80;--okbg:#e6f6ee;--badbg:#fbe9ec;--warnbg:#fbf6d8}}
:root[data-theme=light]{--bg:#f6f7f9;--panel:#fff;--line:#dde1e8;--fg:#14161c;--dim:#5b6375;--acc:#8a7d00;--accfg:#fff;--hot:#c8102e;--ok:#0a8a5a;--cy:#007c80;--okbg:#e6f6ee;--badbg:#fbe9ec;--warnbg:#fbf6d8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,Segoe UI,sans-serif}
main{max-width:1440px;margin:0 auto;padding:16px 16px 64px}body.wide main,body.wide .hdr{max-width:none}
a{color:var(--cy)}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
[hidden]{display:none!important}
h1{font-size:20px;margin:0;letter-spacing:.5px}h1 b{color:var(--acc)}h1 small{font-size:12px;color:var(--dim);font-weight:400;margin-left:6px}
h2{font-size:15px;margin:0 0 10px}h3{font-size:14px;margin:14px 0 6px}
p{margin:0 0 10px}
code,.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all}
.note{color:var(--dim);font-size:12.5px}.ok{color:var(--ok)}.warn,.hot{color:var(--hot)}.neg{color:var(--ok)}
/* header */
#hdr{border-bottom:1px solid var(--line);background:var(--panel)}
.hdr{max-width:1440px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;gap:6px 24px;align-items:center}
.hdr .meta{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.hdr .meta div{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}.hdr .meta .k{color:var(--dim);min-width:40px}
.hdr .path{overflow-wrap:anywhere}
/* buttons and inputs */
button{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;font:inherit}
button:hover:not(:disabled){border-color:var(--acc)}button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600}
button.big{font-size:18px;padding:14px 28px;border-radius:8px}
button.small{padding:3px 9px;font-size:12.5px}
button.link{background:none;border:0;padding:0;color:var(--cy);text-decoration:underline}
input[type=text]{background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;font:inherit}
input[type=checkbox],input[type=radio]{accent-color:var(--acc);width:16px;height:16px;margin:0;flex:none}
label.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer}
label.opt.off{opacity:.55;cursor:not-allowed}label.opt b{display:block}
fieldset{border:0;padding:0;margin:0}legend{font-weight:600;margin-bottom:6px;padding:0}
/* layout blocks */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:16px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 6px}.actions .sp{flex:1}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
.card .k{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.card .v{font-size:22px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}.card .s{font-size:12px;color:var(--dim);overflow-wrap:anywhere}
.msg{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:12px 0}
.msg.ok{background:var(--okbg);border-color:var(--ok);color:var(--fg)}.msg.err{background:var(--badbg);border-color:var(--hot)}
.msg .body{flex:1}.msg ul{margin:6px 0 0;padding-left:20px}
.hero{text-align:center;padding:40px 20px}.hero h2{font-size:22px}.hero p{max-width:560px;margin:0 auto 14px}
.job{border-color:var(--acc)}
.job .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.job .what{font-weight:600}.job .keep{font-size:12.5px;color:var(--dim);margin:8px 0 0}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:10px 0 6px;position:relative}
.bar i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .4s}
.bar.ind i{width:30%;position:absolute;animation:slide 1.3s infinite ease-in-out}
@keyframes slide{from{left:-30%}to{left:100%}}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:rot 1s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes rot{to{transform:rotate(360deg)}}
.probs{list-style:none;margin:0;padding:0}.probs li{padding:8px 0;border-top:1px solid var(--line)}.probs li:first-child{border-top:0;padding-top:0}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:10px;border:1px solid var(--hot);color:var(--hot);margin:1px 4px 1px 0}
.tag.dead{border-color:var(--dim);color:var(--dim)}
.confirm{background:var(--warnbg);border:1px solid var(--acc);border-radius:8px;padding:10px 12px;margin:8px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* table */
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:8px}.tools input[type=text]{max-width:300px}
.tools label{display:flex;gap:6px;align-items:center}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th{color:var(--dim);font-weight:500;font-size:12px;white-space:nowrap}
th button{background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer}th button:hover{color:var(--fg)}
.l{text-align:left}td.num{white-space:nowrap}
tr.mod:hover{background:color-mix(in srgb,var(--acc) 8%,transparent)}
td.big{font-size:15px;font-weight:600}td.big .mb{height:4px;background:var(--line);border-radius:2px;margin-top:4px;min-width:70px}td.big .mb i{display:block;height:100%;background:var(--acc);border-radius:2px}
.modname{background:none;border:0;padding:0;text-align:left;font-weight:600;color:var(--fg);cursor:pointer;overflow-wrap:anywhere}.modname:hover{color:var(--acc)}
tr.detail td{background:var(--bg);text-align:left}tr.detail table td{font-size:12.5px}
.name{min-width:170px;font-family:ui-monospace,Consolas,monospace;font-size:12px;overflow-wrap:anywhere}
@media (max-width:1150px){.opt2{display:none}}
/* dialog */
dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:0;width:min(660px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dhead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}.dhead h2{margin:0;font-size:17px}
.dbody{padding:16px 18px;overflow-y:auto;max-height:calc(92vh - 60px)}
.dbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.sum{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:12px}
.errmsg{color:var(--hot);margin:8px 0 0}
.live{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:10px 0}
.live .big{font-size:34px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums;grid-column:1/-1}
.live .k{font-size:12px;color:var(--dim)}.live .v{font-size:18px;font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row input[type=text]{flex:1;min-width:200px}
textarea{width:100%;height:220px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;font:12px ui-monospace,Consolas,monospace}
/* overlays */
#closed{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;text-align:center;z-index:50;padding:20px}
#closed h2{font-size:24px}
#fatal{position:fixed;left:0;right:0;bottom:0;background:#c8102e;color:#fff;padding:8px 12px;font:12px ui-monospace,Consolas,monospace;z-index:99;white-space:pre-wrap}
</style></head><body>
<header id="hdr"></header>
<main>
<div id="msgs"></div>
<div id="jobbox"></div>
<div id="actions"></div>
<div id="view"><p class="note" style="margin-top:24px">Loading...</p></div>
</main>
<dialog id="dlg" aria-labelledby="dtitle"></dialog>
<div id="closed" hidden><div><h2>VRAM RipperDoc was closed.</h2><p>You can close this window.</p><p class="note">If you expected it to be running, start VRAM RipperDoc again and press the button.</p><button id="retry" class="primary">Try again</button></div></div>
<div id="fatal" hidden></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const sz=b=>{const s=b<0?'-':'',v=Math.abs(b);return v>=2**30?s+(v/2**30).toFixed(2)+' GB':v>=2**20?s+(v/2**20).toFixed(1)+' MB':v>=1024?s+(v/1024).toFixed(0)+' KB':s+v+' B'};
const qs=new URLSearchParams(location.search);
const DEMO=location.protocol==='file:'||qs.has('demo');
const TOKEN=qs.get('t')||'';
if(qs.get('theme')==='dark'||qs.get('theme')==='light')document.documentElement.dataset.theme=qs.get('theme');
window.addEventListener('error',e=>{const f=$('#fatal');f.hidden=false;f.textContent+=(e.message||e.error)+' @'+e.lineno+'\n'});
window.addEventListener('unhandledrejection',e=>{const f=$('#fatal');f.hidden=false;f.textContent+='Unhandled: '+(e.reason&&e.reason.stack||e.reason)+'\n'});

// ---- tiny DOM builder: strings always become text nodes, never HTML ----
function h(tag,a,...kids){const e=document.createElement(tag);
 for(const k in a||{}){const v=a[k];if(v==null||v===false)continue;
  if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
  else if(k==='class')e.className=v;
  else if(k==='value'||k==='checked'||k==='disabled'||k==='hidden')e[k]=v;
  else e.setAttribute(k,v===true?'':v);}
 kids.forEach(x=>add(e,x));return e}
function add(e,x){if(x==null||x===false)return;if(Array.isArray(x))x.forEach(y=>add(e,y));else e.append(x instanceof Node?x:document.createTextNode(String(x)))}
function put(e,...kids){e.replaceChildren();kids.forEach(x=>add(e,x))}
const p=(cls,...k)=>{const a={class:cls};if(k[0]&&typeof k[0]==='object'&&!(k[0] instanceof Node)&&!Array.isArray(k[0]))Object.assign(a,k.shift());return h('p',a,...k)},b=t=>h('b',null,t);
const sum=(a,k)=>a.reduce((n,m)=>n+(m[k]||0),0);
const fmtClock=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const fmtLeft=s=>s<10?'a few seconds':s<90?'about '+Math.round(s)+' seconds':'about '+Math.ceil(s/60)+' minutes';
const fmtDate=s=>{const d=new Date(s);return isNaN(d)?String(s||''):d.toLocaleString()};

// ---- state ----
let S=null,ui={sortK:'always',sortD:-1,open:new Set(),q:'',grp:false,notes:[],undo:false,dismissed:null,liveErr:'',liveLabel:null,dlgUpdate:null};
const wine=()=>S&&S.platform==='wine';
const busy=()=>!!(S&&S.busy);
const keyOf=m=>m.package||m.name;
// Wide view: the whole window width. A cookie, because the page's address (its port) changes every start; cookies don't care.
const wideOn=()=>/(?:^|; )ripperdoc_wide=1/.test(document.cookie);
function setWide(on){document.cookie='ripperdoc_wide='+(on?'1':'0')+'; max-age=31536000; path=/; SameSite=Strict';document.body.classList.toggle('wide',on)}

async function api(method,path,body){
 if(DEMO)return Demo.api(method,path,body);
 let r;
 try{r=await fetch(path,{method,headers:Object.assign({'X-RipperDoc-Token':TOKEN},body===undefined?{}:{'Content-Type':'application/json'}),body:body===undefined?undefined:JSON.stringify(body)})}
 catch(e){throw new Error("Can't reach VRAM RipperDoc. It may have been closed.")}
 let j=null;try{j=await r.json()}catch{}
 if(!r.ok)throw new Error((j&&j.error)||'Something went wrong ('+r.status+').');
 return j}
function notify(kind,text,extra){ui.notes.push({kind,text,extra});renderNotes()}
async function act(method,path,body){try{return await api(method,path,body)}catch(e){notify('err',e.message);return null}}
async function refresh(){try{S=await api('GET','/api/state');setLost(false);render()}catch(e){setLost(true)}}
function setLost(v){$('#closed').hidden=!v}
function focusSave(){const a=document.activeElement;return a&&a.dataset&&a.dataset.fid?{id:a.dataset.fid,s:a.selectionStart,e:a.selectionEnd}:null}
function focusRestore(f){if(!f)return;const el=[...document.querySelectorAll('[data-fid]')].find(x=>x.dataset.fid===f.id);if(el){el.focus();try{if(f.s!=null)el.setSelectionRange(f.s,f.e)}catch{}}}

// ---- events from the exe ----
let ES=null;
function connectEvents(){
 if(ES)return;
 const es=ES=new EventSource('/api/events?t='+encodeURIComponent(TOKEN));
 es.addEventListener('job',ev=>onJob(JSON.parse(ev.data)));
 es.addEventListener('changed',()=>refresh());
 es.onopen=()=>setLost(false);
 es.onerror=()=>{refresh()};}
function onJob(j){if(!S)return;const was=busy();S.busy=j;if(was!==!!j)render();else renderJob();if(ui.dlgUpdate)ui.dlgUpdate()}

// ---- dialogs ----
function openDialog(title,body,onUpdate){
 const d=$('#dlg');ui.dlgUpdate=onUpdate||null;
 put(d,h('div',{class:'dhead'},h('h2',{id:'dtitle'},title),h('button',{class:'small','aria-label':'Close',onclick:closeDialog},'Close')),h('div',{class:'dbody'},body));
 if(!d.open)d.showModal();dlgFocus()}
function dlgFocus(){const first=$('#dlg .dbody input:not(:disabled),#dlg .dbody button:not(:disabled),#dlg .dbody textarea');if(first)first.focus()}
function closeDialog(){const d=$('#dlg');if(d.open)d.close()}
$('#dlg').addEventListener('close',()=>{ui.dlgUpdate=null});
$('#dlg').addEventListener('click',e=>{if(e.target===e.currentTarget)closeDialog()});
const errBox=()=>h('p',{class:'errmsg',role:'alert',hidden:true});
const showErr=(el,t)=>{el.textContent=t;el.hidden=!t};

// ---- header ----
function renderHeader(){
 const R=S.report,g=S.game;
 const gpu=R&&R.gpu?R.gpu+(R.gpuVram?' ('+sz(R.gpuVram)+')':''):null;
 put($('#hdr'),h('div',{class:'hdr'},
  h('h1',null,h('b',null,'VRAM '),'RipperDoc',h('small',null,'v'+S.version)),
  h('div',{class:'meta'},
   h('div',null,h('span',{class:'k'},'Game'),g.found?h('span',{class:'path mono'},g.path):h('span',{class:'warn'},'not found'),h('button',{class:'small',onclick:openGame},g.found?'Change':'Set folder')),
   (gpu||(R&&R.settings))?h('div',null,h('span',{class:'k'},'GPU'),h('span',null,[gpu,R.settings].filter(Boolean).join('  ·  '))):null)));}

// ---- notes (errors and results) ----
function renderNotes(){
 put($('#msgs'),...ui.notes.map((n,i)=>h('div',{class:'msg '+n.kind,role:n.kind==='err'?'alert':'status'},
  h('div',{class:'body'},n.text,n.extra||null),
  h('button',{class:'small','aria-label':'Dismiss',onclick:()=>{ui.notes.splice(i,1);renderNotes()}},'Dismiss'))));}

// ---- job progress ----
const JOBNAME={scan:'Scanning your mods',fix:'Building the budget fix',live:'Measuring VRAM'};
const JOBKEEP={scan:'Please keep this window open. Big mod lists can take a few minutes. Nothing in your game is changed.',fix:'Please keep this window open. This writes one new file; your mods are not changed.',live:'Measuring goes on until you press Stop.'};
function jobCard(j){
 const pct=j.total>0?Math.min(100,j.done/j.total*100):0;
 return h('div',{class:'panel job',role:'status'},
  h('div',{class:'top'},h('span',{class:'what'},h('span',{class:'spin'}),JOBNAME[j.kind]||'Working'),
   h('span',{class:'note'},[j.total>0?j.done.toLocaleString()+' / '+j.total.toLocaleString():'',j.etaSeconds!=null?fmtLeft(j.etaSeconds)+' left':'',h('span',{id:'elapsed'},'running for '+fmtClock((Date.now()-Date.parse(j.startedAt))/1000))].filter(Boolean).flatMap((x,i)=>i?['  ·  ',x]:[x]))),
  p('',j.message),
  h('div',{class:'bar'+(j.total>0?'':' ind'),role:'progressbar','aria-valuemin':0,'aria-valuemax':100,'aria-valuenow':j.total>0?Math.round(pct):null},h('i',{style:j.total>0?'width:'+pct+'%':null})),
  h('p',{class:'keep'},JOBKEEP[j.kind]||''),
  j.kind==='live'?h('button',{onclick:openMeasure},'Show live numbers'):null);}
function resultCard(L){
 const d=L.details||{},fix=L.kind==='fix';
 return h('div',{class:'msg '+(L.ok?'ok':'err'),role:L.ok?'status':'alert'},h('div',{class:'body'},
  h('b',null,L.message),
  L.ok&&fix&&d.nextSteps&&d.nextSteps.length?[h('p',{style:'margin:8px 0 0'},'What to do next:'),h('ol',null,d.nextSteps.map(s=>h('li',null,s)))]:null,
  L.ok&&L.kind==='live'&&d.compare?p('',d.compare):null,
  L.ok&&fix?h('div',{class:'row',style:'margin-top:8px'},h('button',{class:'small',onclick:()=>openThing('fix')},'Show the file'),d.skipped?h('button',{class:'small',onclick:()=>openThing('fixlog')},'Open the log'):null):null),
  h('button',{class:'small',onclick:()=>{ui.dismissed=L.finishedAt;renderJob()}},'Dismiss'));}
function renderJob(){
 const box=$('#jobbox'),j=S.busy,L=S.lastJob;put(box,);
 if(j)box.append(jobCard(j));
 else if(L&&L.kind!=='undo'&&ui.dismissed!==L.finishedAt)box.append(resultCard(L));}
setInterval(()=>{const e=$('#elapsed');if(e&&S&&S.busy)e.textContent='running for '+fmtClock((Date.now()-Date.parse(S.busy.startedAt))/1000)},1000);

// ---- actions ----
function openThing(what){return act('POST','/api/open',{what})}
async function doScan(){ui.dismissed=null;if(await act('POST','/api/scan',{}))await refresh()}
async function doUndo(){ui.undo=false;const r=await act('POST','/api/undo',{});renderActions();if(!r)return;
 notify('ok',r.message||'The budget fix was removed.',S.report?h('span',null,' ',h('button',{class:'link',onclick:doScan},'Scan again'),' to refresh the numbers.'):null);await refresh()}
function renderActions(){
 const box=$('#actions'),R=S.report,bz=busy(),why=bz?'Wait until the current task has finished.':null,noRep=!R?'Scan your mods first.':null;
 const L=S.live||{},liveBusy=bz&&S.busy.kind==='live';
 const btn=(txt,fn,dis,tip,cls)=>h('button',{class:cls||'',onclick:fn,disabled:!!dis,title:dis?tip:null},txt);
 put(box,h('div',{class:'actions'},
  (R||bz)?btn('Scan my mods',doScan,bz,why):null,
  btn('Apply budget fix...',openFix,bz||!R||!R.mods.length,why||noRep||'No mods to fix.',R&&R.budget.current>R.budget.budget&&!R.budgetArchive?'primary':''),
  btn('Undo budget fix',()=>{ui.undo=true;renderActions()},bz||!(S.fix&&S.fix.found),why||'There is no budget fix to remove.'),
  btn('Measure VRAM...',openMeasure,(bz&&!liveBusy)||(!L.available&&!liveBusy),bz&&!liveBusy?why:(L.why||'Not available here.')),
  h('span',{class:'sp'}),
  btn('Open report file',()=>openThing('report'),!R,noRep,'small'),
  btn('Open tool folder',()=>openThing('folder'),false,'','small')),
  bz?p('note','Some buttons are grey while a task is running.'):null,
  ui.undo?h('div',{class:'confirm',role:'alertdialog','aria-label':'Remove the budget fix'},b('Remove the budget fix?'),' Your mods stay as they are.',h('button',{class:'primary small',onclick:doUndo},'Yes, remove it'),h('button',{class:'small',onclick:()=>{ui.undo=false;renderActions()}},'Cancel')):null);}

// ---- game folder ----
function gameForm(onDone){
 const err=errBox(),inp=h('input',{type:'text','data-fid':'game','aria-label':'Cyberpunk 2077 folder',placeholder:wine()?'Paste your Cyberpunk 2077 folder here':'Paste your Cyberpunk 2077 folder here',value:(S.game&&S.game.path)||''});
 const go=h('button',{class:'primary'},'Use this folder');
 const save=async()=>{showErr(err,'');go.disabled=true;try{S=await api('POST','/api/game',{path:inp.value.trim()});render();onDone&&onDone()}catch(e){showErr(err,e.message)}go.disabled=false};
 go.addEventListener('click',save);inp.addEventListener('keydown',e=>{if(e.key==='Enter')save()});
 return h('div',null,p('note',wine()?'The folder that contains the "bin" and "archive" folders.':'Open your game folder in Explorer, click the address bar, copy it and paste it here. The game\'s exe or any folder inside the game also works.'),
  h('div',{class:'row'},inp,go),err);}
function openGame(){openDialog('Where is Cyberpunk 2077?',gameForm(closeDialog))}

// ---- views ----
